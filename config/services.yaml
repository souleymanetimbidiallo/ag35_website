parameters:
    img_params: '%kernel.project_dir%/public/params/images'
    uploads_directory: '%kernel.project_dir%/public/pdf'
    filesDirectory: '%kernel.project_dir%/public/uploads/fichiers'

services:
    App\Service\ApiProvider:
        autowire: true
        autoconfigure: true

    App\EventListener\FetchDataListener:
        arguments:
            $helloAssoService: '@App\Service\HelloAssoService'
        tags:
            - { name: kernel.event_listener, event: kernel.request }
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
     # config/services.yaml

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # ...

    App\EventListener\AdminListener:
        arguments: ['@security.password_hasher']
        tags:
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: preUpdate }

    App\Twig\AppExtension:
        arguments:
            $appName: '%env(APP_NAME)%'
        tags: ['twig.extension']

    App\Service\ParameterService:
        arguments:
            $entityManager: '@doctrine.orm.default_entity_manager'

    App\Service\MenuService:
        arguments:
            $entityManager: '@doctrine.orm.default_entity_manager'

    App\Service\TexteService:
        arguments:
            $entityManager: '@doctrine.orm.default_entity_manager'        
    App\Service\FileUploader:
        arguments:
            $targetDirectory: '%filesDirectory%'
    App\Service\HelloAssoService:
        arguments:
            $client: '@http_client'
            $apiUrl: '%env(HELLOASSO_API_URL)%'
            $clientId: '%env(HELLOASSO_CLIENT_ID)%'
            $clientSecret: '%env(HELLOASSO_CLIENT_SECRET)%'

    App\Service\GoogleCalendarService:
        arguments:
            $clientId: '%env(GOOGLE_CLIENT_ID)%'
            $redirectUri: '%env(GOOGLE_REDIRECT_URI)%'
            $scope:     '%env(GOOGLE_SCOPES)%'
            $authConfig:     '%env(GOOGLE_AUTH_CONFIG)%'
            $apiKey:     '%env(GOOGLE_API_KEY)%'
    App\Command\SyncAdhesionsCommand:
        tags: ['console.command']
