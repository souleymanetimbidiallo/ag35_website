# config/packages/vich_uploader.yaml

vich_uploader:
    db_driver: orm
    metadata:
        type: attribute
    mappings:
        ag35_images:
            uri_prefix: /img/ag35
            upload_destination: '%kernel.project_dir%/public/img/ag35'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        # Guides PDF téléchargeables (page /guide)
        pdf_files:
            uri_prefix: /pdf
            upload_destination: '%kernel.project_dir%/public/pdf'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        ag35_files:
            uri_prefix: /uploads/fichiers
            upload_destination: '%kernel.project_dir%/public/uploads/fichiers'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
