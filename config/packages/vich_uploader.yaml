# config/packages/vich_uploader.yaml or app/config/config.yml
vich_uploader:
    db_driver: orm

    metadata:
        type: attribute

    mappings:
        ag35_images:
            uri_prefix: /img/ag35
            upload_destination: '%kernel.project_dir%/public/img/ag35'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer