services:
  - type: web
    name: symfony-app
    runtime: php
    plan: free
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase: postgres
    buildCommand: "composer install --no-dev --optimize-autoloader"
    startCommand: "php -S 0.0.0.0:10000 -t public"
    disk:
      name: tmp
      mountPath: /tmp
